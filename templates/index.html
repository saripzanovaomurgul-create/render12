<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой проект на Django</title>
</head>
<body>
    <h1>Список моих задач</h1>
    <ul>
        {% for task in tasks %}
            <li>{{ task.title }} (Создано: {{ task.created_at }})</li>
        {% empty %}
            <li>Пока нет ни одной задачи. Добавьте через админку!</li>
        {% endfor %}
    </ul>
</body>
</html>
